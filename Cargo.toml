[package]
name = "cpmt"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Payment adapter execution and minimal gate evidence without custody or commercial policy"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cpmt"
readme = "README.md"
include = ["Cargo.toml", "src/**", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[features]
default = []
stripe = ["dep:async-stripe", "dep:stripe-client-core", "dep:miniserde", "dep:tracing", "dep:tokio"]
storage = ["dep:crlt"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ed25519-dalek = { version = "3", features = ["serde"] }
hmac = "0.13"
zeroize = { version = "1", features = ["derive"] }
async-stripe = { version = "1.0.0-rc.9", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-ring", "redact-generated-debug"], optional = true }
stripe-client-core = { package = "async-stripe-client-core", version = "1.0.0-rc.9", optional = true }
miniserde = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
