schema = 1
project = "cpmt"

# Select affected checks explicitly; no implicit full language/platform matrix.
[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]

# Pre-existing checks above preserved verbatim; hosted Linux gates appended below.
[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["ccid", "first-party"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-features", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked", "--all-features"],
  ["python3", ".ci/test-provider-regressions.py"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
  ["bash", "-c", "set -euo pipefail\nPATH=\"$(ccid toolchain wasm-bindgen):$PATH\" CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo test --locked --target wasm32-unknown-unknown --lib"],
  ["ccid", "coverage", "run"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["node", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--all-features", "check", "advisories"]]
cache_pure = false

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["ccid:run-declared-checks"]
events = ["manual"]

[check_shell]

[security]
dependencies = "cargo-deny"

[coverage]
artifacts = true

[[coverage.exclusions]]
file = "src/payments/engine.rs"
line = 53
source = "Mode::Simulation => unreachable!(),"
reason = "account_identity returns Error::Invalid for Mode::Simulation in the guard above, so the Simulation arm of the mode name match is never reached."
targets = ["native"]

[coverage.exclusions.evidence_sources]
"src/payments/engine.rs" = "4116a48b29905a53966ae7a72e09d5787da130c804cab8c11c457b5f90305961"

[[coverage.exclusions]]
file = "src/payments/engine.rs"
line = 63
source = ".map_err(|_| Error::Invalid)?;"
reason = "serde_json::to_vec of a tuple of a string literal, four borrowed strings and a mode name cannot fail: every element serializes infallibly and no map keys are involved."
targets = ["native"]

[coverage.exclusions.evidence_sources]
"src/payments/engine.rs" = "4116a48b29905a53966ae7a72e09d5787da130c804cab8c11c457b5f90305961"

[runtime]
tools = ["python3", "nodejs_24", "cargo-llvm-cov", "cargo-deny"]
install_root = true

[toolchain]
nightly = true
targets = ["stable:wasm32-unknown-unknown"]
